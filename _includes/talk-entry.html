<article class="archive__item talk-entry">
  <h3 class="archive__item-title">
    {% if include.talk.invited %}<span class="talk-entry__label">Invited:</span> {% endif %}{{ include.talk.title | escape }}
  </h3>
  <p class="page__meta">
    <em>{{ include.talk.event | escape }}</em>{% if include.talk.location %}, {{ include.talk.location | escape }}{% endif %}{% if include.talk.date %}, {{ include.talk.date | date: "%e %B %Y" }}{% endif %}
  </p>
</article>
